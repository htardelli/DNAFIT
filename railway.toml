# Deploy do FITPLAN no Railway.
# O app é a RAIZ deste repositório: em Settings → Root Directory deixe vazio.
# (Antes o app vivia em planges/fitplan e o Root Directory era "fitplan".)
[build]
builder = "nixpacks"

[deploy]
startCommand = "python -c \"import os; import uvicorn; uvicorn.run('app:app', host='0.0.0.0', port=int(os.environ.get('PORT', 8090)))\""
restartPolicyType = "on_failure"
